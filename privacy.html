<h1>隱私權政策</h1>
<p>最後更新：2026-11-21</p>
<p>「OBS YouTube 自動結束工具」是個人自用的 OBS 腳本，只在使用者本人的電腦上執行。</p>
<h2>使用的資料</h2>
<ul>
  <li>透過 YouTube Data API 讀取使用者本人頻道的直播清單，並把進行中的直播設為「已結束」。</li>
  <li>授權資訊（refresh token）只存在使用者本人電腦的檔案中。</li>
</ul>
<h2>不會做的事</h2>
<ul>
  <li>不會收集、上傳、分享或販售任何資料給第三方。</li>
  <li>不會存取直播管理以外的帳號資料。</li>
</ul>
<h2>撤銷授權</h2>
<p>隨時可到 <a href="https://myaccount.google.com/permissions">Google 帳戶權限頁面</a> 移除本工具的存取權。</p>
<h2>聯絡方式</h2>
<p>GitHub：<a href="https://github.com/snowwall20-cmd">snowwall20</a></p>
